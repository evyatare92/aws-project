AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private ECR repositories for container images. EKS node roles and the ECS task
  execution role already include account-wide ECR pull permissions; repository
  names follow ${ProjectName}-${Environment}/* so they align with the EKS-User
  IAM policy in the EKS stack. agentcore is linux/arm64 (AgentCore Runtime).

Parameters:
  ProjectName:
    Type: String
    Default: aws-project
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  MainRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/main'
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}/main'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  WeatherRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/weather'
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}/weather'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AgentcoreRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}/agentcore'
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}/agentcore'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  MainRepositoryName:
    Value: !Ref MainRepository
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcrMainRepositoryName'

  MainRepositoryUri:
    Value: !GetAtt MainRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcrMainRepositoryUri'

  MainRepositoryArn:
    Value: !GetAtt MainRepository.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcrMainRepositoryArn'

  WeatherRepositoryUri:
    Value: !GetAtt WeatherRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcrWeatherRepositoryUri'

  AgentcoreRepositoryUri:
    Value: !GetAtt AgentcoreRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcrAgentcoreRepositoryUri'

  DockerLoginCommand:
    Description: Run on a machine with Docker and AWS CLI credentials that can push to ECR.
    Value: !Sub >-
      aws ecr get-login-password --region ${AWS::Region}
      | docker login --username AWS --password-stdin
      ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
