AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  VPC-attached Lambda functions behind a private API Gateway REST API (HTTP,
  reachable only via the execute-api VPC endpoint) plus an SQS-triggered
  worker. Includes a Claude Sonnet 4.5 weather agent. No public URLs.

Parameters:
  ProjectName:
    Type: String
    Default: aws-project
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  LambdaRuntime:
    Type: String
    Default: python3.13
    AllowedValues: [python3.12, python3.13]

  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900

  SqsVisibilityTimeout:
    Type: Number
    Default: 180
    Description: Must be greater than or equal to LambdaTimeout.

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Anthropic API key. Stored in Secrets Manager and injected as the Lambda
      environment variable ANTHROPIC_API_KEY. Leave blank on later updates to
      keep the existing secret.

  AgentCodeS3Key:
    Type: String
    Default: lambda/agent/handler.zip

  AgentCodeS3ObjectVersion:
    Type: String
    Default: ''
    Description: S3 object version of the agent zip. Makefile always passes this.

  SqsCodeS3Key:
    Type: String
    Default: lambda/sqs-weather/handler.zip

  SqsCodeS3ObjectVersion:
    Type: String
    Default: ''
    Description: S3 object version of the SQS weather zip. Makefile always passes this.

  MainAppNamespace:
    Type: String
    Default: weather

  MainAppServiceAccount:
    Type: String
    Default: weather-main

Conditions:
  SetAnthropicApiKey: !Not [!Equals [!Ref AnthropicApiKey, '']]
  HasAgentCodeVersion: !Not [!Equals [!Ref AgentCodeS3ObjectVersion, '']]
  HasSqsCodeVersion: !Not [!Equals [!Ref SqsCodeS3ObjectVersion, '']]

Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Lambda ENIs for ${ProjectName}-${Environment}'
      VpcId: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-lambda'

  AgentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-agent-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-anthropic-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref AnthropicSecret

  AnthropicSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/anthropic'
      Description: Anthropic API key for the weather agent Lambda
      SecretString: !If
        - SetAnthropicApiKey
        - !Sub '{"api_key":"${AnthropicApiKey}"}'
        - !Ref AWS::NoValue
      GenerateSecretString: !If
        - SetAnthropicApiKey
        - !Ref AWS::NoValue
        - SecretStringTemplate: '{"api_key":""}'
          GenerateStringKey: placeholder
          PasswordLength: 16
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}/${Environment}/anthropic'

  HttpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-http-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  SqsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-sqs-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: sqs-consume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt WorkQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt WeatherResultsTable.Arn

  MainAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-main-app'
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${ProviderArn}" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${IssuerHost}:aud": "sts.amazonaws.com",
                    "${IssuerHost}:sub": "system:serviceaccount:${Namespace}:${ServiceAccount}"
                  }
                }
              }
            ]
          }
        - ProviderArn: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-EksOidcProviderArn'
          IssuerHost: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-EksOidcIssuerHost'
          Namespace: !Ref MainAppNamespace
          ServiceAccount: !Ref MainAppServiceAccount
      Policies:
        - PolicyName: enqueue-and-read-weather
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt WorkQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt WeatherResultsTable.Arn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-main-app'

  HttpLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-http'
      Description: Invoked by the private REST API (internal HTTP only).
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt HttpLambdaRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Split
          - ','
          - !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-AppSubnetIds'
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json'},
                  'body': json.dumps({
                      'message': 'hello from http lambda',
                      'path': event.get('path'),
                  }),
              }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-http'

  AgentLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-agent'
      Description: Claude Sonnet 4.5 weather agent, invoked by the private REST API.
      Runtime: !Ref LambdaRuntime
      Handler: !If
        - HasAgentCodeVersion
        - handler.handler
        - index.handler
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 29
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Split
          - ','
          - !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-AppSubnetIds'
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !If
            - SetAnthropicApiKey
            - !Ref AnthropicApiKey
            - !Sub '{{resolve:secretsmanager:${AnthropicSecret}:SecretString:api_key}}'
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecret
          ANTHROPIC_MODEL: claude-sonnet-4-5
      Code: !If
        - HasAgentCodeVersion
        - S3Bucket: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ArtifactsBucket'
          S3Key: !Ref AgentCodeS3Key
          S3ObjectVersion: !Ref AgentCodeS3ObjectVersion
        - ZipFile: |
            def handler(event, context):
                return {
                    'statusCode': 503,
                    'headers': {'Content-Type': 'application/json'},
                    'body': '{"error":"agent bundle has not been uploaded yet"}',
                }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-agent'

  SqsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sqs'
      Description: SQS-triggered live weather for Bangkok and Tokyo.
      Runtime: !Ref LambdaRuntime
      Handler: !If
        - HasSqsCodeVersion
        - handler.handler
        - index.handler
      Role: !GetAtt SqsLambdaRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Split
          - ','
          - !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-AppSubnetIds'
      Environment:
        Variables:
          RESULTS_TABLE: !Ref WeatherResultsTable
      Code: !If
        - HasSqsCodeVersion
        - S3Bucket: !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ArtifactsBucket'
          S3Key: !Ref SqsCodeS3Key
          S3ObjectVersion: !Ref SqsCodeS3ObjectVersion
        - ZipFile: |
            def handler(event, context):
                return {'batchItemFailures': []}
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-sqs'

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-lambda-dlq'
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-lambda-dlq'

  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-lambda-work'
      VisibilityTimeout: !Ref SqsVisibilityTimeout
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-lambda-work'

  WeatherResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-weather-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-weather-results'

  SqsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt WorkQueue.Arn
      FunctionName: !Ref SqsLambda
      FunctionResponseTypes:
        - ReportBatchItemFailures

  PrivateApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-internal-api'
      Description: Private REST API — reachable only through the execute-api VPC endpoint.
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !ImportValue
            'Fn::Sub': '${ProjectName}-${Environment}-ExecuteApiEndpointId'
      # Relative ARN form ("execute-api:/*") keeps the policy from referencing the
      # API's own id, which would be a circular dependency.
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: execute-api:Invoke
            Resource: 'execute-api:/*'
            Condition:
              StringEquals:
                aws:SourceVpce: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-ExecuteApiEndpointId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-internal-api'

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateApi
      ParentId: !GetAtt PrivateApi.RootResourceId
      PathPart: hello

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateApi
      ResourceId: !Ref ApiResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HttpLambda.Arn}/invocations'

  AgentApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateApi
      ParentId: !GetAtt PrivateApi.RootResourceId
      PathPart: weather

  AgentCityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateApi
      ParentId: !Ref AgentApiResource
      PathPart: '{city}'

  AgentApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateApi
      ResourceId: !Ref AgentCityResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        TimeoutInMillis: 29000
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentLambda.Arn}/invocations'

  HttpLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HttpLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateApi}/*/*/*'

  AgentLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateApi}/*/*/*'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
      - AgentApiMethod
    Properties:
      RestApiId: !Ref PrivateApi
      Description: !Sub 'agent ${AgentCodeS3ObjectVersion}'

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PrivateApi
      DeploymentId: !Ref ApiDeployment
      StageName: v1
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-internal-api-v1'

Outputs:
  HttpLambdaArn:
    Value: !GetAtt HttpLambda.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HttpLambdaArn'

  AgentLambdaArn:
    Value: !GetAtt AgentLambda.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AgentLambdaArn'

  AnthropicSecretArn:
    Value: !Ref AnthropicSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AnthropicSecretArn'

  SqsLambdaArn:
    Value: !GetAtt SqsLambda.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-SqsLambdaArn'

  WorkQueueUrl:
    Value: !Ref WorkQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WorkQueueUrl'

  WorkQueueArn:
    Value: !GetAtt WorkQueue.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WorkQueueArn'

  WeatherResultsTableName:
    Value: !Ref WeatherResultsTable
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WeatherResultsTableName'

  MainAppRoleArn:
    Value: !GetAtt MainAppRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-MainAppRoleArn'

  PrivateApiId:
    Value: !Ref PrivateApi
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateApiId'

  PrivateApiInvokeUrl:
    Description: >-
      Call from inside the VPC via the execute-api endpoint DNS name.
    Value: !Sub
      - 'https://${ApiId}-${VpceId}.execute-api.${AWS::Region}.amazonaws.com/v1/hello'
      - ApiId: !Ref PrivateApi
        VpceId: !ImportValue
          'Fn::Sub': '${ProjectName}-${Environment}-ExecuteApiEndpointId'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateApiInvokeUrl'

  AgentApiUrl:
    Description: >-
      Private invoke URL for the weather agent. From inside the VPC this resolves
      through the execute-api endpoint (PrivateDnsEnabled).
    Value: !Sub 'https://${PrivateApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AgentApiUrl'
