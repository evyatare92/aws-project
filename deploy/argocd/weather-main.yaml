# Applied by make argocd (bastion). Source of truth is git, not S3 Helm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-main
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/evyatare92/aws-project.git
    targetRevision: main
    path: deploy/charts/main
    helm:
      releaseName: weather-main
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: weather
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Rollouts (and the Gateway API plugin) patch Service selectors and HTTPRoute
  # weights during a canary. Without this, Argo CD selfHeal snaps traffic to 100/0.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules
        - .metadata.labels
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
