apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "main.fullname" . }}
  labels:
    {{- include "main.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "main.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "main.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "main.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "main.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- with .Values.weather.serviceUrl }}
            - name: WEATHER_SERVICE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.serviceUrl }}
            - name: AGENT_SERVICE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agentcore.runtimeArn }}
            - name: AGENTCORE_RUNTIME_ARN
              value: {{ . | quote }}
            {{- end }}
            - name: AWS_REGION
              value: {{ .Values.awsRegion | default "eu-west-1" | quote }}
            {{- with .Values.queue.queueUrl }}
            - name: WEATHER_QUEUE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.queue.resultsTable }}
            - name: WEATHER_RESULTS_TABLE
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem is on, so give Node a writable scratch dir.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Prefer one replica per node/AZ. ScheduleAnyway so a canary pod can
      # still land on the two-node group (DoNotSchedule would leave it Pending).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "main.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "main.selectorLabels" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    canary:
      stableService: {{ include "main.fullname" . }}
      canaryService: {{ include "main.canaryServiceName" . }}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ include "main.fullname" . }}
            namespace: {{ .Release.Namespace }}
      steps:
        - setCanaryScale:
            replicas: {{ .Values.canary.replicaCount }}
        - pause: {}
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause:
            duration: {{ .Values.canary.autoPromoteAfter | quote }}
