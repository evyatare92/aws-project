apiVersion: v1
kind: Service
metadata:
  name: {{ include "main.fullname" . }}
  labels:
    {{- include "main.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "main.selectorLabels" . | nindent 4 }}
---
# Rollouts mutates this selector to the canary ReplicaSet hash.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "main.canaryServiceName" . }}
  labels:
    {{- include "main.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "main.selectorLabels" . | nindent 4 }}
