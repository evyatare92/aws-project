replicaCount: 2

# Argo Rollouts canary. Extra pod is 1 so the two-node group can fit it.
# Empty pause = manual promote; duration = automatic.
canary:
  replicaCount: 1
  autoPromoteAfter: 2m

image:
  repository: 034971967415.dkr.ecr.eu-west-1.amazonaws.com/aws-project-dev/main
  # Rewritten by "make charts-stage" from app/main/.version. Do not set this to
  # a mutable tag like "latest": nodes that already cached it never pull again.
  tag: "1.2.8"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  # IRSA role from infra/40-lambda/functions.yaml. Filled in by "make charts-stage".
  roleArn: arn:aws:iam::034971967415:role/aws-project-dev-main-app

service:
  # ClusterIP: the Gateway ALB reaches pod IPs (targetType: ip). Bastion access
  # uses kubectl port-forward ("make app-forward"), not a node port.
  type: ClusterIP
  port: 80
  targetPort: 8080

gateway:
  # Resources are rendered when sourceRange (direct ALB IP lock) or
  # securityGroupId (CloudFront prefix-list SG from "make cdn") is set.
  enabled: true
  className: aws-alb
  loadBalancerName: aws-project-dev-gw
  sourceRange: ""
  securityGroupId: sg-086fec0e749be52a2
  # Public subnet IDs (AZs a/b/c). Filled by "make charts-stage" from NAT stack exports.
  subnetIds: "subnet-0341dec6d1538679e,subnet-05d928b25a6f078ee,subnet-0fee9644a18a6f3a6"
  healthCheckPath: /healthz

# The node image's built-in "node" user is uid 1000 and binds 8080, so nothing
# here needs root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

weather:
  # Where the app's backend calls for live data. ECS Cloud Map name from
  # infra/31-ecs/weather-service.yaml; only resolves inside the VPC.
  # Blank disables live lookups and the app serves placeholder data.
  serviceUrl: http://weather.aws-project-dev.local:8080

agent:
  # Private API Gateway invoke URL (stage only, no /weather path). Filled in by
  # "make charts-stage" from the aws-project-dev-AgentApiUrl export.
  serviceUrl: https://19vuy25gvg.execute-api.eu-west-1.amazonaws.com/v1

agentcore:
  # AgentCore Runtime ARN for Tel Aviv. Filled in by "make charts-stage" from
  # the aws-project-dev-AgentCoreRuntimeArn export.
  runtimeArn: arn:aws:bedrock-agentcore:eu-west-1:034971967415:runtime/aws_project_dev_telaviv-sXbc613gi2

queue:
  # Work queue + DynamoDB results table for Bangkok/Tokyo. Filled in by
  # "make charts-stage" from the lambda stack exports.
  queueUrl: https://sqs.eu-west-1.amazonaws.com/034971967415/aws-project-dev-lambda-work
  resultsTable: aws-project-dev-weather-results
