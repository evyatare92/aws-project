# Sized for the two t3.small nodes. Dashboard is ClusterIP only;
# "make rollouts-ui" port-forwards it (same pattern as argocd-ui).
# Gateway API plugin is copied from ghcr into the controller pod.
#
# Chart: argo-rollouts 2.43.2 (app v1.10.0). Plugin image v0.17.0.

dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  initContainers:
    - name: copy-gatewayapi-plugin
      image: ghcr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0
      command: ["/bin/sh", "-c"]
      args:
        - cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins
      volumeMounts:
        - name: gatewayapi-plugin
          mountPath: /plugins
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: file:///plugins/rollouts-plugin-trafficrouter-gatewayapi
  volumes:
    - name: gatewayapi-plugin
      emptyDir: {}
  volumeMounts:
    - name: gatewayapi-plugin
      mountPath: /plugins

providerRBAC:
  providers:
    gatewayAPI: true
