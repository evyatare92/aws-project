# Sized for the two t3.small nodes. Dex/notifications/ApplicationSet stay off.
# server.insecure lets make argocd-ui port-forward HTTP without a cert.

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
